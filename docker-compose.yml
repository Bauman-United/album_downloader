version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: vk-album-bot
    restart: unless-stopped
    environment:
      - VK_ACCESS_TOKEN=${VK_ACCESS_TOKEN}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - YANDEX_DISK_PATH=${YANDEX_DISK_PATH:-/VK_Albums}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Telegram user ids allowed to change the VK token (comma separated, empty = everyone)
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      # Where the token set via /set_vk_token is stored
      - VK_TOKEN_FILE=${VK_TOKEN_FILE:-/app/data/vk_token.json}
    volumes:
      # Mount volume for temporary album storage
      - album-data:/app/vk_downloaded_albums
      # Persist the VK token set via /set_vk_token across restarts
      - bot-config:/app/data
    # Uncomment to limit resources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

volumes:
  album-data:
    driver: local
  bot-config:
    driver: local
